<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reserva tu Cita Online | PVL Barbershop Santo Domingo</title>
<meta name="description" content="Elige tu barbero y reserva tu cita en PVL Barbershop, barbería en Santo Domingo. Confirmación rápida y directa por WhatsApp." />
<link rel="canonical" href="https://www.pvlbarbershop.com/reserva.html" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Reserva tu Cita | PVL Barbershop Santo Domingo" />
<meta property="og:description" content="Elige a tu barbero y reserva tu cita en segundos por WhatsApp con PVL Barbershop." />
<meta property="og:url" content="https://www.pvlbarbershop.com/reserva.html" />
<meta property="og:locale" content="es_DO" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="reserva">

  <div id="site-header" class="site-header"></div>

  <section class="page-header">
    <div class="container">
      <p class="script-tag">Elige a tu barbero</p>
      <h1 class="page-title">Reserva tu Cita</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="barbers-grid" class="grid"></div>
    </div>
  </section>

  <section id="reservar-formulario" class="section section-alt">
    <div class="container">
      <h2 class="section-title">Confirma tu Cita</h2>
      <form id="booking-form" class="booking-form">
        <label>
          Servicio
          <select id="bf-service" required></select>
        </label>
        <label>
          Barbero
          <select id="bf-barber"></select>
        </label>
        <label>
          Fecha
          <input type="date" id="bf-date" required />
        </label>
        <label>
          Hora
          <input type="time" id="bf-time" required />
        </label>
        <label>
          Tu nombre
          <input type="text" id="bf-name" required placeholder="Ej. Juan Pérez" />
        </label>
        <button type="submit" class="btn btn-primary">Enviar por WhatsApp</button>
      </form>
    </div>
  </section>

  <div id="site-footer" class="site-footer"></div>

  <!-- Modal de perfil de barbero -->
  <div id="barber-modal-overlay" class="modal-overlay">
    <div class="barber-modal">
      <button id="modal-close" class="modal-close" aria-label="Cerrar">&times;</button>
      <div class="modal-scroll">
        <div class="modal-profile-header">
          <div class="modal-avatar" id="modal-avatar"></div>
          <h3 id="modal-name">jose</h3>
          <p id="modal-tagline" class="modal-tagline"></p>
        </div>
        <div class="modal-video" id="modal-video"></div>
        <div class="modal-gallery" id="modal-gallery"></div>
      </div>
      <button id="modal-book-btn" class="btn btn-primary modal-book-btn">Reservar con este barbero</button>
    </div>
  </div>

  <script src="data/catalog.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reserva.js"></script>
</body>
</html>
